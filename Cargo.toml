[workspace]
members = ["crates/capability-server", "crates/plugin-host"]
resolver = "2"

[workspace.dependencies]
capability-server = { path = "./crates/capability-server" }
plugin-host = { path = "./crates/plugin-host" }

reqwest = { version = "0.12.12", features = ["multipart", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
base64 = "0.22.1"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = [""]
description = "A workspace for agent capabilities"
license = "MIT"
