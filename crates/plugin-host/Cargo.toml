[package]
name = "plugin-host"
version = "0.1.0"
edition = "2021"
description = "Host implementation for the WASM Component plugin system"
license = "MIT"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
base64.workspace = true

# oai
async-openai = { version = "0.28.0", features = ["byot"] }

# auth
argon2 = "0.5.3"
jwt = "0.16.0"
hmac = "0.12.1"

# wasm
wit-component = "0.226.0"
wasmtime = { version = "30.0", features = ["component-model"] }
wasmtime-wasi = { version = "30.0" }
wasmtime-wasi-http = { version = "30.0" }

# http
axum = { version = "0.8", features = ["macros", "tokio"] }
axum-extra = { version = "0.10", features = ["multipart"] }
tower-http = { version = "0.5", features = ["cors"] }
tower = { version = "0.5" }
reqwest = "0.12.12"
async-stream = "0.3.6"
reqwest-eventsource = "0.6.0"

# util
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4"] }
jsonpath_lib = "0.3.0"
schemars = "1.0.0-alpha.17"
tracing = "0.1.41"
home = "0.5.11"
sha2 = "0.10.8"
log = "0.4"
anyhow = "1.0"
tiktoken-rs = "0.6.0"
futures-core = "0.3.31"
futures = "0.3.31"

# vecdb
lancedb = { version = "0.18.0", optional = true }
arrow-schema = { version = "54.1", features = ["serde"], optional = true }
arrow-array = { version = "54.1", optional = true }
serde_arrow = { version = "0.13.0", features = ["arrow-54"], optional = true }
futures-util = { version = "0.3.31", optional = true }

[features]
vectordb = [
    "lancedb",
    "arrow-schema",
    "arrow-array",
    "futures-util",
    "serde_arrow",
]
